[package]
name = "wallet-observer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Keyless wallet balances, NAV, policy checks, and movement recommendations"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Algo-set/wallet-observer"
publish = false

[lib]
name = "wallet_observer"
path = "src/lib.rs"

[[bin]]
name = "wallet-observer"
path = "src/bin/wallet-observer.rs"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
